<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Mind Map Manual</title>
  <link rel="stylesheet" href="style.css?v=20260804-about-docs">
</head>
<body class="about-page">
  <main class="about-doc">
    <header class="about-hero">
      <a class="about-back-link" href="index.html">Back to app</a>
      <h1>Research Mind Map Manual</h1>
      <p>Detailed guide for the local research mapping prototype, including workflows, integrations, storage, sharing, troubleshooting, and roadmap notes.</p>
    </header>

    <div id="manualContent">Loading manual...</div>
  </main>

  <script>
    fetch("docs/manual-content.html")
      .then((response) => {
        if (!response.ok) throw new Error("Could not load manual content.");
        return response.text();
      })
      .then((html) => {
        document.getElementById("manualContent").innerHTML = html;
        if (window.location.hash) {
          document.querySelector(window.location.hash)?.scrollIntoView();
        }
      })
      .catch((error) => {
        document.getElementById("manualContent").textContent = error.message;
      });
  </script>
</body>
</html>
